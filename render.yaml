services:
  - type: web
    name: evolution-api
    runtime: docker
    region: ohio
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      # ========== AUTENTICACIÓN ==========
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      
      # ========== URL DEL SERVICIO ==========
      - key: SERVER_URL
        value: https://evolution-api.onrender.com
      
      # ========== BASE DE DATOS POSTGRESQL (NEON) ==========
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: "postgresql"                           # CAMBIADO: postgresql en lugar de sqlite
      - key: DATABASE_CONNECTION_URI
        value: "postgresql://neondb_owner:npg_fWjFibwpE8Q1@ep-fancy-mud-amml74jo-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require&schema=public"
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: "evolution_neon"
      
      # ========== QUÉ DATOS GUARDAR (OPCIONAL) ==========
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: DATABASE_SAVE_DATA_HISTORIC
        value: "true"
      
      # ========== CONFIGURACIÓN DE INSTANCIA ==========
      - key: DEL_INSTANCE
        value: "false"
      - key: QRCODE_EXPIRY
        value: "120"
      
      # ========== LOGS ==========
      - key: LOG_LEVEL
        value: "INFO,ERROR,WARN,DEBUG"
      - key: LOG_COLOR
        value: "true"
      
      # ========== CORS ==========
      - key: CORS_ORIGIN
        value: "*"
      - key: CORS_METHODS
        value: "POST,GET,PUT,DELETE"
      - key: CORS_CREDENTIALS
        value: "true"
      
      # ========== WEBHOOKS ==========
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
    
    # ========== NOTA SOBRE EL DISCO ==========
    # Con PostgreSQL (Neon), el disco persistente ya NO es necesario para la base de datos,
    # pero SIGUE SIENDO NECESARIO para guardar la sesión de WhatsApp.
    # Las sesiones de WhatsApp se guardan en /evolution/store
    disk:
      name: evolution-data
      mountPath: /evolution/store
      sizeGB: 1
    
    healthCheckPath: /
